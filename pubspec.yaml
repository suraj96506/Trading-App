name: ticker_sim
description: A Flutter trading simulator app.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.0.0
  decimal: ^2.3.0
  uuid: ^4.3.0
  path_provider: ^2.0.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.5
  hive_generator: ^2.0.1
  riverpod_generator: ^2.2.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/AppIcon.png"
  android: true
  ios: true


flutter:
  uses-material-design: true
